name: Publish Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag (must match pyproject.toml)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine image tags
        id: tags
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          requested = os.environ.get('REQUESTED_VERSION') or os.environ.get('RELEASE_TAG', '').removeprefix('v')
          if requested and requested != version:
              raise SystemExit('Image version must match pyproject.toml')
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          tags = [image + ':sha-' + os.environ['GITHUB_SHA'][:7]]
          if requested:
              tags.extend([image + ':' + requested, image + ':latest'])
          else:
              tags.append(image + ':edge')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + ','.join(tags) + '\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
